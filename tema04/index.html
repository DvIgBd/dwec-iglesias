<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Cambia [Tu nombre] por tu nombre -->
  <title>Calculadora y bucles · David</title>

  <!-- CSS de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

  <!--
    PLANTILLA DE LA TAREA 4
    · Solo trae lo imprescindible para empezar. La maquetación con Bootstrap es cosa tuya y cuenta en la nota:
      rejilla (row y col-*) que se adapte al móvil, cards, botones con color, grupos de botones, iconos...
    · Todo lo que va entre [corchetes] es un hueco: sustitúyelo por lo tuyo.
    · Tu JavaScript va en js/app.js. El archivo js/ayudas.js NO se toca.
  -->

  <!-- NAVBAR con tu nombre -->
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container">
      <span class="navbar-brand"><i class="bi bi-person-circle"></i> David Iglesias Borland</span>
      <span class="navbar-text">Tarea 4 · DWEC</span>
    </div>
  </nav>

  <!-- CABECERA -->
  <header class="bg-body-tertiary border-bottom py-4 mb-4">
    <div class="container">
      <h1 class="h2 mb-1">Calculadora y bucles</h1>
      <p class="lead mb-0 text-body-secondary">Cálculo, comparaciones, comprobaciones y bucles</p>
    </div>
  </header>

  <main class="container mb-5">

    <!-- TODO: organiza las cards con la rejilla de Bootstrap: <div class="row"> y dentro <div class="col-12 col-lg-...">.
               En el móvil, una debajo de otra; en pantalla grande, repartidas en columnas. -->

    <!-- LOS NÚMEROS. No cambies los id: leerNumero("numero1") y leerNumero("numero2") los buscan por su id -->
    <section class="card mb-4">
      <div class="card-header">Los números</div>
      <div class="card-body">
        <label for="numero1" class="form-label">Número 1</label>
        <input type="number" id="numero1" class="form-control mb-3">
        <label for="numero2" class="form-label">Número 2</label>
        <input type="number" id="numero2" class="form-control">
      </div>
    </section>

    <!-- RESULTADO. Aquí escriben mostrar(), anadirLinea() y anadirBadge(). No cambies el id -->
    <section class="card mb-4">
      <div class="card-header">Resultado</div>
      <div class="card-body">
        <div id="salida"></div>
      </div>
    </section>

    <!-- EJERCICIO 1 · Calculadora -->
    <section class="card mb-4">
      <div class="card-header">Calculadora</div>
      <div class="card-body">
        <button type="button" class="btn btn-primary m-1" onclick="sumar()">Sumar</button>
        <button type="button" class="btn btn-primary m-1" onclick="restar()">Restar</button>
        <button type="button" class="btn btn-primary m-1" onclick="multiplicar()">Multiplicar</button>
        <button type="button" class="btn btn-primary m-1" onclick="dividir()">Dividir</button>
        <button type="button" class="btn btn-primary m-1" onclick="potencia()">Potencia</button>
        <button type="button" class="btn btn-primary m-1" onclick="modulo()">Módulo</button>
      </div>
    </section>

    <!-- TODO EJERCICIO 2 · Comparaciones: una card con los botones
               «¿Cuál es mayor?» → cualEsMayor()     «¿Par o impar?» → parOImpar() -->

    <!-- TODO EJERCICIOS 3 Y 4 · Bucles: una card con dos grupos de botones (btn-group)
               Con texto:  for → bucleFor()    while → bucleWhile()    do…while → bucleDoWhile()
               Con badges: for → badgesFor()   while → badgesWhile()   do…while → badgesDoWhile() -->

  </main>

  <footer class="bg-body-tertiary border-top py-3">
    <div class="container small text-body-secondary">
      David Iglesias Borland · DWEC 26/27 · Tarea 4 · Las capturas, la reflexión y las fuentes están en el README.
    </div>
  </footer>

  <!-- JS de Bootstrap, las funciones de ayuda y, después, tu JavaScript. Este orden importa -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ayudas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
